backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Tag / Category", name: "tag", widget: "select", options: ["Hair Care", "Skin Care", "Nail Art", "Manicure", "Barbershop", "General"] }
      - { label: "Excerpt", name: "excerpt", widget: "string", hint: "Short summary shown on the blog list" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
